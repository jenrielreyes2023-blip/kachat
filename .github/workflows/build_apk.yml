name: Build Flutter APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

env:
  GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -Dorg.gradle.daemon=true -Dorg.gradle.parallel=true -Dorg.gradle.caching=true"
  JAVA_OPTS: "-Xmx4096m"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Get Dependencies
        run: flutter pub get

      - name: Patch Linux case-sensitivity in pub cache
        run: |
          find /home/runner/.pub-cache -name "video_screen.dart" -exec sed -i 's/TIMUIKITMessageItem/TIMUIKitMessageItem/g' {} + || true

      - name: Build arm64-v8a APK
        run: flutter build apk --release --split-per-abi --no-tree-shake-icons

      - name: Upload arm64-v8a APK
        uses: actions/upload-artifact@v4
        with:
          name: kachat-arm64-v8a-release
          path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
